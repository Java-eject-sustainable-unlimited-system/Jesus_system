server:
  address: 127.0.0.1 # Manual control and health endpoints are local-only by default.
  port: 9090 # Watchdog's own port; the monitored legacy target is expected on 8080.

spring:
  application:
    name: jesus-watchdog-agent

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jesus:
  watchdog:
    enabled: true # Standalone app explicitly opts in; embedded hosts must opt in themselves.
    # Target process identification (Java 17 ProcessHandle matching)
    process-command-keyword: java
    target-process-keywords: [ egov, tomcat ]
    # Nix flake app respawned after ejection
    nix-run-target: ".#jesus-server-17"
    # Manual ejection is disabled unless a token is provided through the environment.
    manual-control-token: ${JESUS_WATCHDOG_MANUAL_CONTROL_TOKEN:}
    # Monitored target endpoints
    health-endpoint: http://localhost:8080/actuator/health
    # Add each intended HTTP(S) origin explicitly when monitoring a remote target.
    health-endpoint-allowed-origins: [ http://localhost:8080 ]
    probe-host: 127.0.0.1
    probe-port: 8080
    # Timeouts
    probe-timeout: 300ms
    http-timeout: 1500ms
    # Ejection thresholds
    failure-threshold: 3
    io-failure-threshold: 2
    heap-critical-threshold: 0.92
    min-free-disk-space: 500MB
    # Recovery rate limits (guard against restart loops caused by false positives)
    recovery-cooldown: 30s
    recovery-window: 10m
    max-recoveries-per-window: 3
    # Refuse to kill if more processes than this match the keywords (over-broad match guard)
    max-target-processes: 5
    # Log what would happen without killing or respawning anything
    dry-run: false
