name: J.E.S.U.S CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Java 17)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK & Maven
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Maven & Java Version
        run: |
          mvn -version
          java -version

      - name: Build & Test with Maven
        run: |
          echo "=================================================="
          echo " [✝️] Running J.E.S.U.S Maven Verify (Java 17)"
          echo "=================================================="
          mvn clean verify

          echo " [✨] Build, Packaging & Tests Successful!"

      - name: Test Rust JVM prototype
        run: cargo test --locked --manifest-path ada-jvm/rust-vm/Cargo.toml

  openjml-formal-verification:
    name: OpenJML Formal Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pinned OpenJML
        run: |
          curl -fsSLo "$RUNNER_TEMP/openjml.zip" \
            https://github.com/OpenJML/OpenJML/releases/download/21.0.28/openjml-ubuntu-24.04-21.0.28.zip
          echo "0a151820c4e680e32cb2e399a02615182c748fc24e308865b317783d4836df8a  $RUNNER_TEMP/openjml.zip" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openjml"
          unzip -q "$RUNNER_TEMP/openjml.zip" -d "$RUNNER_TEMP/openjml"

      - name: Verify failure counter contracts
        run: |
          "$RUNNER_TEMP/openjml/openjml" --esc --source 17 \
            src/main/java/com/jesus/system/monitor/FailureCounter.java
