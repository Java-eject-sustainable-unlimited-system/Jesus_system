name: J.E.S.U.S CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Java 17)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Test Rust JVM prototype
        run: cargo test --locked --manifest-path ada-jvm/rust-vm/Cargo.toml

      - name: Build Rust JVM prototype
        run: cargo build --locked --manifest-path ada-jvm/rust-vm/Cargo.toml

      - name: Install GNAT and gprbuild
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnat gprbuild

      - name: Build and self-test Ada JVM prototype
        working-directory: ada-jvm
        run: |
          gprbuild -P ada_jvm.gpr
          ./build/bin/ada_jvm --self-test

      - name: Export Ada and Rust interpreter paths
        working-directory: ada-jvm
        run: |
          echo "JESUS_ADA_VM=$PWD/build/bin/ada_jvm" >> "$GITHUB_ENV"
          echo "JESUS_RUST_VM=$PWD/rust-vm/target/debug/jesus-rust-vm" >> "$GITHUB_ENV"

      - name: Set up JDK & Maven
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Maven & Java Version
        run: |
          mvn -version
          java -version

      - name: Build & Test with Maven and Ada/Rust JVM integration
        run: |
          echo "=================================================="
          echo " [✝️] Running J.E.S.U.S Maven Verify (Java 17)"
          echo "=================================================="
          mvn clean verify

          echo " [✨] Build, Packaging & Tests Successful!"

      - name: Compare Ada and Rust bytecode results
        working-directory: ada-jvm
        run: |
          set -euo pipefail
          ada_vm="$PWD/build/bin/ada_jvm"
          rust_vm="$PWD/rust-vm/target/debug/jesus-rust-vm"
          code_file="$(mktemp)"
          trap 'rm -f "$code_file"' EXIT
          cases=(
            '\x10\x08\x10\x05\x60\xac'
            '\x02\x10\x03\x6c\xac'
            '\x10\xfd\xac'
            '\x10\x07\x10\x06\x68\xac'
            '\x10\x09\x10\x04\x64\xac'
          )
          for code in "${cases[@]}"; do
            printf '%b' "$code" > "$code_file"
            ada_result="$("$ada_vm" "$code_file" | tr -d '[:space:]')"
            rust_result="$("$rust_vm" "$code_file" | tr -d '[:space:]')"
            if [ "$ada_result" != "$rust_result" ]; then
              echo "Ada/Rust mismatch for bytecode $code: Ada=$ada_result Rust=$rust_result" >&2
              exit 1
            fi
            echo "Ada and Rust agree: $ada_result"
          done

  openjml-formal-verification:
    name: OpenJML Formal Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pinned OpenJML
        run: |
          curl -fsSLo "$RUNNER_TEMP/openjml.zip" \
            https://github.com/OpenJML/OpenJML/releases/download/21.0.28/openjml-ubuntu-24.04-21.0.28.zip
          echo "0a151820c4e680e32cb2e399a02615182c748fc24e308865b317783d4836df8a  $RUNNER_TEMP/openjml.zip" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openjml"
          unzip -q "$RUNNER_TEMP/openjml.zip" -d "$RUNNER_TEMP/openjml"

      - name: Verify failure counter contracts
        run: |
          "$RUNNER_TEMP/openjml/openjml" --esc --source 17 \
            src/main/java/com/jesus/system/monitor/FailureCounter.java
